model:
  name_or_path: "Qwen/Qwen2.5-7B-Instruct"
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.1
  num_train_epochs: 3
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 100
  eval_strategy: "steps"
  eval_steps: 100
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  seed: 42
  output_dir: "outputs/qwen2.5-7b-text2sql"
  # Save a checkpoint every N epochs. Set to null to disable epoch-based checkpointing.
  # Example: save_checkpoints: 5  →  saves after epoch 5, 10, 15, ...
  save_checkpoints: 10

data:
  train_path: "data/train.jsonl"
  val_path: "data/val.jsonl"
  test_path: "data/test.jsonl"
  system_prompt_path: "prompts/system_prompt.txt"
