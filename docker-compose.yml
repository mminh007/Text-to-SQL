services:
  generate:
    build:
      context: .
      dockerfile: Dockerfile
    image: text-to-sql-generate:latest
    container_name: text-to-sql-generate
    
    # Đọc toàn bộ biến từ file .env trên host
    env_file:
      - .env

    # Mount thư mục data ra host để lưu output
    volumes:
      - ./data:/app/data

    # Lệnh mặc định: sinh data + dedup + split
    # Override khi chạy: docker compose run generate python generate_data.py --generate
    command: python generate_data.py --all

    # Restart policy: không tự restart (job một lần)
    restart: "no"
