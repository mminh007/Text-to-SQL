services:
  generate:
    build:
      context: .
      dockerfile: Dockerfile
    image: text-to-sql-generate:latest
    container_name: text-to-sql-generate
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Default: sinh data + dedup + split
    # Override: docker compose run generate python src/data/generate_data.py --generate
    command: python src/data/generate_data.py --all
    restart: "no"

